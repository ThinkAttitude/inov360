<div class="horarios-page">
    <header class="horarios-header">
        <div class="header-left">
            <div class="page-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
            </div>

            <div class="header-text">
                <h2 class="horarios-title">Consulta de Horários</h2>
                <p class="horarios-desc">
                    Este é o módulo onde o administrador pode consultar os seus horários atribuídos.
                </p>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <section class="horarios-content">
        <div class="calendar-section">
            <div class="section-header">
                <div class="section-info">
                    <div class="section-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                    </div>
                    <h3 class="section-title">Calendário de Eventos</h3>
                </div>

                <div class="calendar-legend">
                    <div class="legend-item">
                        <span class="legend-dot trabalho"></span>
                        <span>Trabalho</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot ferias"></span>
                        <span>Férias</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot ausencia"></span>
                        <span>Ausências</span>
                    </div>
                </div>
            </div>

            <div class="calendar-container">
                <!-- FullCalendar will render inside here -->
                <div id="calendar"></div>
            </div>
        </div>
    </section>
</div>
