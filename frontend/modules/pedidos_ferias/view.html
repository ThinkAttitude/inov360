<div class="ferias-page" id="pedidos-ferias-page">
    <div class="ferias-header">
        <div class="ferias-header-left">
            <div class="ferias-page-icon" aria-hidden="true">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 2v4"></path>
                    <path d="M16 2v4"></path>
                    <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                    <path d="M3 10h18"></path>
                    <path d="M8 14h.01"></path>
                    <path d="M12 14h.01"></path>
                    <path d="M16 14h.01"></path>
                    <path d="M8 18h.01"></path>
                    <path d="M12 18h.01"></path>
                    <path d="M16 18h.01"></path>
                </svg>
            </div>

            <div class="ferias-header-text">
                <h2 id="ferias-title">Férias e Ausências</h2>
                <p id="ferias-subtitle">Gerencie os seus pedidos de férias, licenças e ausências pessoais.</p>
            </div>
        </div>

        <div class="ferias-header-actions">
            <button type="button" class="btn-primary" id="ferias-novo-pedido-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M12 8v8"></path>
                    <path d="M8 12h8"></path>
                </svg>
                <span>Novo Pedido</span>
            </button>
        </div>
    </div>

    <div class="ferias-content">
        <div class="ferias-stats" role="list" aria-label="Resumo de pedidos">
            <div class="ferias-stat-card" role="listitem">
                <div class="ferias-stat-icon" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <path d="M14 2v6h6"></path>
                    </svg>
                </div>
                <div class="ferias-stat-meta">
                    <div class="ferias-stat-value" id="ferias-total-value"></div>
                    <div class="ferias-stat-label">Total Pedidos</div>
                </div>
            </div>

            <div class="ferias-stat-card" role="listitem">
                <div class="ferias-stat-icon" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M12 6v6l4 2"></path>
                    </svg>
                </div>
                <div class="ferias-stat-meta">
                    <div class="ferias-stat-value" id="ferias-pendentes-value"></div>
                    <div class="ferias-stat-label">Pendentes</div>
                </div>
            </div>

            <div class="ferias-stat-card" role="listitem">
                <div class="ferias-stat-icon" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 6 9 17l-5-5"></path>
                    </svg>
                </div>
                <div class="ferias-stat-meta">
                    <div class="ferias-stat-value" id="ferias-aprovados-value"></div>
                    <div class="ferias-stat-label">Aprovados</div>
                </div>
            </div>

            <div class="ferias-stat-card" role="listitem">
                <div class="ferias-stat-icon" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M15 9l-6 6"></path>
                        <path d="M9 9l6 6"></path>
                    </svg>
                </div>
                <div class="ferias-stat-meta">
                    <div class="ferias-stat-value" id="ferias-rejeitados-value"></div>
                    <div class="ferias-stat-label">Rejeitados</div>
                </div>
            </div>
        </div>

        <div class="ferias-filters" aria-label="Filtros">
            <div class="ferias-tabs" role="tablist" aria-label="Filtrar pedidos">
                <button type="button" class="ferias-tab is-active" role="tab" aria-selected="true" data-filter="all" id="ferias-tab-all">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <path d="M14 2v6h6"></path>
                    </svg>
                    <span>Todos (<span id="ferias-count-all"></span>)</span>
                </button>

                <button type="button" class="ferias-tab" role="tab" aria-selected="false" data-filter="pending" id="ferias-tab-pending">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M12 6v6l4 2"></path>
                    </svg>
                    <span>Pendentes (<span id="ferias-count-pending"></span>)</span>
                </button>

                <button type="button" class="ferias-tab" role="tab" aria-selected="false" data-filter="approved" id="ferias-tab-approved">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20 6 9 17l-5-5"></path>
                    </svg>
                    <span>Aprovados (<span id="ferias-count-approved"></span>)</span>
                </button>

                <button type="button" class="ferias-tab" role="tab" aria-selected="false" data-filter="rejected" id="ferias-tab-rejected">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M15 9l-6 6"></path>
                        <path d="M9 9l6 6"></path>
                    </svg>
                    <span>Rejeitados (<span id="ferias-count-rejected"></span>)</span>
                </button>
            </div>
        </div>

        <div class="ferias-list" id="ferias-pedidos-list" aria-label="Lista de pedidos"></div>

        <div class="ferias-empty" id="ferias-empty" hidden>
            <div class="ferias-empty-inner">
                <div class="ferias-empty-icon" aria-hidden="true">
                    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <path d="M14 2v6h6"></path>
                        <path d="M8 13h8"></path>
                        <path d="M8 17h8"></path>
                    </svg>
                </div>
                <p>Sem pedidos para apresentar.</p>
            </div>
        </div>

        <template id="ferias-pedido-template">
            <article class="ferias-card" data-status="" data-id="">
                <div class="ferias-card-topline" aria-hidden="true"></div>

                <div class="ferias-card-header">
                    <div class="ferias-card-title-wrap">
                        <div class="ferias-card-type-icon" aria-hidden="true"></div>
                        <div class="ferias-card-title-text">
                            <h3 class="ferias-card-title"></h3>
                            <p class="ferias-card-subtitle">Pedido em <span class="ferias-card-created"></span></p>
                        </div>
                    </div>

                    <div class="ferias-card-status">
                        <span class="ferias-card-status-text"></span>
                    </div>
                </div>

                <div class="ferias-card-body">
                    <div class="ferias-date-range" aria-label="Período">
                        <div class="ferias-date-box">
                            <div class="ferias-date-label">INÍCIO</div>
                            <div class="ferias-date-value ferias-card-start"></div>
                        </div>

                        <div class="ferias-date-sep" aria-hidden="true">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 18l6-6-6-6"></path>
                            </svg>
                        </div>

                        <div class="ferias-date-box">
                            <div class="ferias-date-label">FIM</div>
                            <div class="ferias-date-value ferias-card-end"></div>
                        </div>
                    </div>

                    <div class="ferias-field">
                        <div class="ferias-field-label">
                            <span>Justificação</span>
                        </div>
                        <div class="ferias-field-value ferias-card-justification"></div>
                    </div>
                </div>

                <div class="ferias-card-footer">
                    <div class="ferias-card-decider">
                        <span>Decidido por:</span>
                        <strong class="ferias-card-decider-name"></strong>
                    </div>
                </div>
            </article>
        </template>
    </div>
</div>
