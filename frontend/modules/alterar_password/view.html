<div class="apw-page">
    <header class="apw-header">
        <div class="header-left">
            <div class="page-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <div class="header-text">
                <h2>Alterar Palavra-Passe</h2>
                <p>Atualize a sua palavra-passe de acesso à plataforma.</p>
            </div>
        </div>
    </header>

    <section class="apw-content">
        <div class="apw-card">
            <div class="apw-card-header">
                <div class="card-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
                    </svg>
                </div>
                <div>
                    <h3>Nova palavra-passe</h3>
                    <p>Por motivos de segurança, confirme a palavra-passe atual antes de definir uma nova.</p>
                </div>
            </div>

            <div class="apw-card-body">
                <form id="form-alterar-password" novalidate>
                    <div class="apw-form-grid">
                        <div class="field-row">
                            <label class="field-label" for="apw-old">Palavra-passe atual</label>
                            <div class="apw-password-wrapper">
                                <input type="password" id="apw-old" name="old_password"
                                       class="field-input" autocomplete="current-password" required/>
                                <button type="button" class="apw-toggle-btn" data-target="apw-old"
                                        aria-label="Mostrar palavra-passe" aria-pressed="false">
                                    <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24"
                                         fill="none" stroke="currentColor" stroke-width="2"
                                         stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                    <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24"
                                         fill="none" stroke="currentColor" stroke-width="2"
                                         stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                                        <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.77 19.77 0 0 1 5.06-5.94"></path>
                                        <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a19.7 19.7 0 0 1-3.16 4.19"></path>
                                        <line x1="1" y1="1" x2="23" y2="23"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <div class="field-row">
                            <label class="field-label" for="apw-new">Nova palavra-passe</label>
                            <div class="apw-password-wrapper">
                                <input type="password" id="apw-new" name="new_password"
                                       class="field-input" autocomplete="new-password" required minlength="6"/>
                                <button type="button" class="apw-toggle-btn" data-target="apw-new"
                                        aria-label="Mostrar palavra-passe" aria-pressed="false">
                                    <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24"
                                         fill="none" stroke="currentColor" stroke-width="2"
                                         stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                    <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24"
                                         fill="none" stroke="currentColor" stroke-width="2"
                                         stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                                        <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.77 19.77 0 0 1 5.06-5.94"></path>
                                        <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a19.7 19.7 0 0 1-3.16 4.19"></path>
                                        <line x1="1" y1="1" x2="23" y2="23"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <div class="field-row">
                            <label class="field-label" for="apw-confirm">Confirmar nova palavra-passe</label>
                            <div class="apw-password-wrapper">
                                <input type="password" id="apw-confirm" name="confirm_password"
                                       class="field-input" autocomplete="new-password" required minlength="6"/>
                                <button type="button" class="apw-toggle-btn" data-target="apw-confirm"
                                        aria-label="Mostrar palavra-passe" aria-pressed="false">
                                    <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24"
                                         fill="none" stroke="currentColor" stroke-width="2"
                                         stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                    <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24"
                                         fill="none" stroke="currentColor" stroke-width="2"
                                         stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                                        <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.77 19.77 0 0 1 5.06-5.94"></path>
                                        <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a19.7 19.7 0 0 1-3.16 4.19"></path>
                                        <line x1="1" y1="1" x2="23" y2="23"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <p id="apw-feedback" class="apw-feedback" role="status" aria-live="polite"></p>

                    <div class="apw-actions">
                        <button type="reset" class="btn-secondary" id="apw-reset">Limpar</button>
                        <button type="submit" class="btn-primary" id="apw-submit">Guardar alterações</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</div>
