    <script>
        (function initFichaColaborador() {
            // Load collaborator data from API
            async function loadFichaData() {
                try {
                    const urlParams = new URLSearchParams(window.location.search);
                    const userId = urlParams.get('user_id') || window.CURRENT_USER?.id;

                    const response = await fetch(`../../api/users/get_ficha_colaborador.php?user_id=${userId}`);
                    const data = await response.json();

                    if (!data.success) {
                        throw new Error(data.message || 'Erro ao carregar dados');
                    }

                    populateHeader(data);
                    populateSections(data);
                    populateContacts(data.contactos_emergencia || []);
                    setupEditModal(data);
                } catch (error) {
                    console.error('Error loading ficha data:', error);
                    if (typeof showToast === 'function') {
                        showToast('❌ Erro ao carregar dados: ' + error.message, 'error');
                    }
                }
            }

            function populateHeader(data) {
                document.getElementById('user-name-display').textContent = data.user_info.name || '';
                document.getElementById('user-email-display').textContent = data.user_info.email || '';

                if (data.is_own_profile) {
                    document.getElementById('ficha-title').textContent = 'Minha Ficha de Colaborador';
                    document.getElementById('ficha-note').textContent = 'Visualize os seus dados pessoais. Para alterações, clique no botão abaixo.';
                } else {
                    document.getElementById('ficha-title').textContent = 'Ficha de Colaborador';
                    document.getElementById('ficha-note').textContent = 'Como Admin RH, pode visualizar e editar os dados deste colaborador.';
                }
            }

            function populateSections(data) {
                const dados = data.dados;

                // Dados Pessoais
                const dadosPessoais = [
                    { label: 'Nome', value: dados.nome },
                    { label: 'Email', value: dados.email },
                    { label: 'Telefone', value: dados.telefone },
                    { label: 'Morada', value: dados.morada },
                    { label: 'Código Postal', value: dados.codigo_postal },
                    { label: 'Freguesia', value: dados.freguesia },
                    { label: 'Concelho', value: dados.concelho },
                    { label: 'Distrito', value: dados.distrito },
                    { label: 'Naturalidade', value: dados.naturalidade },
                    { label: 'Habilitações', value: dados.habilitacoes }
                ];
                populateInfoGrid('dados-pessoais', dadosPessoais);

                // Dados Familiares
                const dadosFamiliares = [
                    { label: 'Pai', value: dados.pai },
                    { label: 'Mãe', value: dados.mae },
                    { label: 'Estado Civil', value: dados.estado_civil },
                    { label: 'Data Nascimento', value: dados.data_nascimento },
                    { label: 'País', value: dados.pais },
                    { label: 'Tipo Documento', value: dados.tipo_documento },
                    { label: 'Número Documento', value: dados.numero_documento },
                    { label: 'Emitido em', value: dados.emitido_em },
                    { label: 'Arquivo', value: dados.arquivo },
                    { label: 'Validade Documento', value: dados.validade_documento },
                    { label: 'NIF', value: dados.nif },
                    { label: 'Número Segurança Social', value: dados.numero_seg_social }
                ];
                populateInfoGrid('dados-familiares', dadosFamiliares);

                // Dados Fiscais
                const dadosFiscais = [
                    { label: 'Descontos Fiscais', value: dados.descontos_fiscais },
                    { label: 'Repartição Finanças', value: dados.reparticao_financas },
                    { label: 'Região', value: dados.regiao },
                    { label: 'Estado Fiscal', value: dados.estado_fiscal },
                    { label: 'Deficiência', value: dados.deficiencia },
                    { label: 'Cônjuge Deficiente', value: dados.conjugue_deficiente ? 'Sim' : 'Não' },
                    { label: 'Nº Dependentes', value: dados.num_dependentes },
                    { label: 'Nº Dependentes Deficientes', value: dados.num_dependentes_deficientes },
                    { label: 'Pensionista', value: dados.pensionista ? 'Sim' : 'Não' }
                ];
                populateInfoGrid('dados-fiscais', dadosFiscais);

                // Dados Contratuais
                const dadosContratuais = [
                    { label: 'Data Admissão', value: dados.data_admissao },
                    { label: 'Tipo de Contrato', value: dados.tipo_contrato },
                    { label: 'Profissão', value: dados.profissao },
                    { label: 'Categoria', value: dados.categoria },
                    { label: 'Regime', value: dados.regime },
                    { label: 'Horas/Semana', value: dados.horas_semana },
                    { label: 'Salário Base', value: dados.salario_base ? dados.salario_base + ' €' : '', highlight: true },
                    { label: 'Sub. Alimentação', value: dados.subsidio_alimentacao ? dados.subsidio_alimentacao + ' €' : '' },
                    { label: 'NIB', value: dados.nib },
                    { label: 'Ordenado Líquido', value: dados.ordenado_liquido ? dados.ordenado_liquido + ' €' : '', highlight: true },
                    { label: 'Validação Empresa', value: dados.validacao_empresa }
                ];
                populateInfoGrid('dados-contratuais', dadosContratuais);
            }

            function populateInfoGrid(containerId, items) {
                const container = document.getElementById(containerId);
                container.innerHTML = items.map(item => `
                    <div class="info-card${item.highlight ? ' highlight' : ''}">
                        <div class="info-label">${item.label}</div>
                        <div class="info-value">${item.value || '-'}</div>
                    </div>
                `).join('');
            }

            function populateContacts(contacts) {
                const container = document.getElementById('contactos-container');

                if (!contacts || contacts.length === 0) {
                    container.innerHTML = `
                        <div class="empty-contacts">
                            <div class="empty-icon">
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                                </svg>
                            </div>
                            <p>Sem contactos de emergência registados.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = `
                    <div class="contacts-grid">
                        ${contacts.map(c => `
                            <div class="contact-card">
                                <div class="contact-avatar">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                        <circle cx="12" cy="7" r="4"></circle>
                                    </svg>
                                </div>
                                <div class="contact-info">
                                    <div class="contact-name">${c.nome || ''}</div>
                                    <div class="contact-relation">${c.parentesco || ''}</div>
                                    <div class="contact-phone">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                                        </svg>
                                        ${c.telefone || ''}
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            function setupEditModal(data) {
                const modal = document.getElementById('modalEdicaoCompleta');
                const btnOpen = document.getElementById('abrirEdicaoCompleta');
                const closeBtns = [document.getElementById('fecharModalEdicao'), document.getElementById('cancelarEdicaoCompleta')];

                btnOpen.addEventListener('click', () => {
                    modal.style.display = 'flex';
                    document.body.style.overflow = 'hidden';
                    populateEditForm(data);
                });

                closeBtns.forEach(btn => btn.addEventListener('click', () => {
                    modal.style.display = 'none';
                    document.body.style.overflow = '';
                }));

                setupEditFormSubmit();
            }

            function populateEditForm(data) {
                document.getElementById('edit-user-id').value = data.target_user_id;

                // Populate emergency contacts
                const contacts = data.contactos_emergencia || [];
                if (contacts.length > 0) {
                    document.getElementById('emergencia_nome').value = contacts[0].nome || '';
                    document.getElementById('emergencia_parentesco').value = contacts[0].parentesco || '';
                    document.getElementById('emergencia_telefone').value = contacts[0].telefone || '';
                }

                // Create form fields dynamically based on dados
                const container = document.getElementById('form-fields-container');
                const dados = data.dados;

                const enumOptions = {
                    'estado_civil': ['Solteiro', 'Casado', 'Viuvo', 'Divorciado', 'Uniao de Facto', 'Separado Judicialmente'],
                    'tipo_documento': ['CC', 'Titulo Residencia', 'Passaporte'],
                    'tipo_contrato': ['Sem termo', 'Termo certo', 'Termo incerto', 'Estágio', 'Prestação serviços'],
                    'regime': ['Tempo Inteiro', 'Tempo Parcial'],
                    'estado_fiscal': ['Nao Casado', 'Casado 1 Titular', 'Casado 2 Titulares'],
                    'deficiencia': ['Nao Deficiente', 'Deficiente', 'Defic. F.Armadas'],
                    'conjugue_deficiente': ['Sim', 'Não'],
                    'pensionista': ['Sim', 'Não']
                };

                const dateFields = ['data_nascimento', 'emitido_em', 'validade_documento', 'data_admissao'];
                const moneyFields = ['salario_base', 'subsidio_alimentacao', 'ordenado_liquido'];

                container.innerHTML = Object.entries(dados)
                    .filter(([key]) => key !== 'user_id')
                    .map(([key, value]) => {
                        const label = key.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

                        if (enumOptions[key]) {
                            const options = enumOptions[key].map(opt =>
                                `<option value="${opt}" ${value === opt ? 'selected' : ''}>${opt}</option>`
                            ).join('');
                            return `
                                <label style="display:flex;flex-direction:column;font-size:.75rem;font-weight:600;color:#475569;gap:4px;">
                                    <span>${label}</span>
                                    <select name="${key}" style="padding:.6rem .75rem;border:1px solid #cbd5e1;border-radius:8px;">
                                        ${options}
                                    </select>
                                </label>
                            `;
                        } else if (dateFields.includes(key)) {
                            return `
                                <label style="display:flex;flex-direction:column;font-size:.75rem;font-weight:600;color:#475569;gap:4px;">
                                    <span>${label}</span>
                                    <input type="date" name="${key}" value="${value || ''}" style="padding:.6rem .75rem;border:1px solid #cbd5e1;border-radius:8px;" />
                                </label>
                            `;
                        } else if (moneyFields.includes(key)) {
                            return `
                                <label style="display:flex;flex-direction:column;font-size:.75rem;font-weight:600;color:#475569;gap:4px;">
                                    <span>${label}</span>
                                    <input type="text" inputmode="decimal" name="${key}" value="${value || ''}" style="padding:.6rem .75rem;border:1px solid #cbd5e1;border-radius:8px;" />
                                </label>
                            `;
                        } else {
                            return `
                                <label style="display:flex;flex-direction:column;font-size:.75rem;font-weight:600;color:#475569;gap:4px;">
                                    <span>${label}</span>
                                    <input name="${key}" value="${value || ''}" style="padding:.6rem .75rem;border:1px solid #cbd5e1;border-radius:8px;" />
                                </label>
                            `;
                        }
                    }).join('');
            }

            function setupEditFormSubmit() {
                const form = document.getElementById('formEdicaoCompleta');
                const moneyFields = ['salario_base', 'subsidio_alimentacao', 'ordenado_liquido'];

                function sanitizarValor(v) {
                    if (v == null) return '';
                    v = v.toString().trim();
                    if (v === '') return '';
                    v = v.replace(/\s+/g, '');
                    if (/,\d{2}$/.test(v)) {
                        v = v.replace(/\./g, '').replace(/,/g, '.');
                    } else if (/\.\d{2}$/.test(v) && v.indexOf(',') > -1) {
                        v = v.replace(/,/g, '');
                    } else {
                        const parts = v.split('.');
                        if (parts.length > 2) {
                            const last = parts.pop();
                            if (/^\d{2}$/.test(last)) {
                                v = parts.join('') + '.' + last;
                            } else {
                                v = parts.join('') + last;
                            }
                        }
                        v = v.replace(/,/g, '');
                    }
                    const num = parseFloat(v);
                    if (isNaN(num)) return '';
                    return num.toFixed(2).replace('.', ',');
                }

                moneyFields.forEach(name => {
                    const input = form.querySelector(`[name="${name}"]`);
                    if (input) {
                        input.addEventListener('blur', () => {
                            const v = sanitizarValor(input.value);
                            if (v !== '') input.value = v;
                        });
                    }
                });

                form.addEventListener('submit', function (e) {
                    e.preventDefault();

                    moneyFields.forEach(name => {
                        const input = form.querySelector(`[name="${name}"]`);
                        if (input) {
                            const v = sanitizarValor(input.value);
                            input.value = v;
                        }
                    });

                    const fd = new FormData(form);
                    const btn = form.querySelector('button[type="submit"]');
                    const label = btn.querySelector('.label-text');
                    const spinner = btn.querySelector('.loading-spinner');

                    label.style.display = 'none';
                    spinner.style.display = 'inline-block';
                    btn.disabled = true;

                    fetch(form.action, { method: 'POST', body: fd, credentials: 'same-origin', cache: 'no-store' })
                        .then(r => r.json())
                        .then(data => {
                            if (typeof showToast === 'function') {
                                showToast(data.success ? '✅ Ficha guardada.' : '❌ ' + (data.message || 'Erro ao guardar'), data.success ? 'success' : 'error');
                            }
                            if (data.success) {
                                setTimeout(() => {
                                    document.getElementById('modalEdicaoCompleta').style.display = 'none';
                                    document.body.style.overflow = '';
                                    loadFichaData();
                                }, 900);
                            }
                        })
                        .catch(() => {
                            if (typeof showToast === 'function') showToast('❌ Erro de rede.', 'error');
                        })
                        .finally(() => {
                            label.style.display = '';
                            spinner.style.display = 'none';
                            btn.disabled = false;
                        });
                });
            }

            // Initialize on page load
            loadFichaData();
        })();
    </script>
