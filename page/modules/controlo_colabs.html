<link rel="stylesheet" href="../../css/controlo_colabs.css">

<div class="controlo-page">
    <header class="controlo-header">
        <div class="header-left">
            <div class="page-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
            </div>

            <div class="header-text">
                <h2 class="controlo-title">Controlo de Colaboradores</h2>
                <p class="controlo-desc">
                    Monitore e gerencie a presença e atividades dos colaboradores em tempo real.
                </p>
            </div>
        </div>

        <div class="header-actions">
            <button
                    type="button"
                    class="btn-primary"
                    id="controlo-add"
                    style="background:linear-gradient(135deg,#10b981,#059669);"
            >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Adicionar
            </button>
        </div>
    </header>

    <section class="controlo-content">
        <!-- Conteúdo específico deste módulo vai aqui -->
    </section>
</div>
