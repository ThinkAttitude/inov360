version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inov360_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./private:/var/www/private
    depends_on:
      - db
    environment:
      DOCKER_ENV: "1" # Signals to db.php that we're in docker

  db:
    image: mysql:5.7
    container_name: inov360_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inov360
      MYSQL_USER: inovuser
      MYSQL_PASSWORD: inovpass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: inov360_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root

volumes:
  db_data:

